<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>World Tuner — Voyage Studio mockup</title>
<style>
:root{
  --bg:#111214; --panel:#191a1d; --panel2:#202125; --line:#2c2d32; --text:#e8e8ea; --muted:#9a9ba3;
  --accent:#4aa3ff; --player:#3fc1a5; --avg:#d9a441; --strong:#e07a4a; --boss:#c8508a;
  --good:#5cc27a; --bad:#e0645a; --radius:10px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;flex-wrap:wrap;align-items:center;gap:16px;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:17px;margin:0;font-weight:600}
header .src{color:var(--muted);font-size:13px}
header .spacer{flex:1}
button,select,.filebtn{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font:inherit;cursor:pointer}
button:hover,.filebtn:hover{border-color:var(--accent)}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible,.filebtn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:#06121f;font-weight:600}
.filebtn input{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.filebtn{position:relative}
header button,header .filebtn{white-space:nowrap}
#lang{flex:0 0 auto}
main{display:grid;grid-template-columns:340px 1fr;gap:16px;padding:16px 20px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.card h2{font-size:14px;margin:0 0 4px;font-weight:600}
.card .sub{color:var(--muted);font-size:12.5px;margin:0 0 12px}
.stack{display:flex;flex-direction:column;gap:16px}
.templates{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tpl{text-align:left;padding:10px;border-radius:8px}
.tpl b{display:block;font-size:13px}
.tpl span{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.tpl.active{border-color:var(--accent);background:#1b2a3a}
.field{margin:12px 0}
.field label{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.field label output{font-variant-numeric:tabular-nums;font-weight:600}
.field .base{color:var(--muted);font-size:11.5px}
.field .base.changed{color:var(--accent)}
.field input[type=range]{width:100%;accent-color:var(--accent)}
.field .hint{color:var(--muted);font-size:12px}
.field .path{color:var(--muted);font:11px ui-monospace,monospace;overflow-wrap:anywhere}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.readouts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.ro{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px}
.ro .k{color:var(--muted);font-size:12px}
.ro .v{font-size:22px;font-weight:650;font-variant-numeric:tabular-nums;margin:2px 0}
.ro .d{font-size:12px}
.tag{display:inline-block;padding:1px 7px;border-radius:99px;font-size:11.5px;font-weight:600}
.tag.harder{background:#3a1f1d;color:#f29a91}.tag.easier{background:#1a3324;color:#8fe0a8}.tag.same{background:#26272c;color:var(--muted)}
.tag.slower{background:#2f2a1a;color:#e7c46d}.tag.faster{background:#1a2b3a;color:#8cc4f5}
svg text{fill:var(--muted);font-size:14px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.legend i.dash{background:none;border-top:2px dashed #999;height:0}
.changes{list-style:none;margin:0;padding:0}
.changes li{padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.changes li:last-child{border-bottom:none}
.changes code{font:12px ui-monospace,monospace;color:#b7b8c0}
.changes .why{color:var(--muted);font-size:12px;margin-top:2px}
.empty{color:var(--muted);font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.note{color:var(--muted);font-size:12px;margin-top:8px}
.bars .bar{display:grid;grid-template-columns:minmax(120px,170px) 1fr auto;gap:10px;align-items:center;margin:7px 0;font-size:13px}
.bars .track{height:10px;background:var(--panel2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bars .fill{height:100%;border-radius:99px;transition:width .25s}
.bars .num{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px}
.overall{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
.overall .big{font-size:28px;font-weight:700}
.piewrap{display:grid;grid-template-columns:1fr 300px;gap:20px;align-items:center;margin:8px 0 16px}
.ph{font-size:13px;margin:0 0 8px;font-weight:600}
.pielegend{list-style:none;margin:0;padding:0;font-size:13px}
.pielegend li{margin:4px 0}.pielegend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:8px;vertical-align:-1px}
.pielegend b{color:var(--muted);font-weight:600}
.layers{display:flex;flex-direction:column;gap:10px}
.layer{border-radius:8px;padding:12px 14px;color:#f2f2f4;display:flex;flex-direction:column}
.layer span{font-size:12px;opacity:.85}.layer big{font-size:26px;font-weight:700}
.overall-hex{background:#6e6e3a;clip-path:polygon(8% 0,92% 0,100% 50%,92% 100%,8% 100%,0 50%);align-items:center;text-align:center}
.how{margin:16px 20px 0}
.how summary{cursor:pointer;font-size:14px;font-weight:600}
.how ol{margin:10px 0 0;padding-inline-start:20px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px 24px}
.how li{color:var(--muted);font-size:13px}.how li b{color:var(--text);font-weight:600}
svg{direction:ltr}.path,code{direction:ltr;unicode-bidi:isolate}
@media (max-width:1100px){.how ol{grid-template-columns:1fr 1fr}}
@media (max-width:640px){.how ol{grid-template-columns:1fr}}
@media (max-width:1100px){main{grid-template-columns:1fr}.piewrap{grid-template-columns:1fr}.grid2,.readouts{grid-template-columns:1fr}}
@media (max-width:640px){.bars .bar{grid-template-columns:1fr auto}.bars .track{grid-column:1/-1;grid-row:2}}
</style>
</head>
<body>
<header>
  <h1>World Tuner</h1><span class="src" data-i18n-title="version.title" title="Page version">v2026-11-13b</span>
  <span class="src" id="src"></span>
  <span class="spacer"></span>
  <label for="lang" class="empty" data-i18n="lang.label">Language</label>
  <select id="lang"></select>
  <label class="filebtn"><span data-i18n="btn.load">Load world.json</span><input type="file" id="file" accept=".json,application/json"></label>
  <button id="reset" data-i18n="btn.reset">Reset to loaded</button>
  <button class="primary" id="export" data-i18n="btn.export">Export changed world</button>
</header>

<details class="card how" id="how" open>
  <summary data-i18n="how.h">How to use this</summary>
  <ol><li data-i18n="how.1"></li><li data-i18n="how.2"></li><li data-i18n="how.3"></li><li data-i18n="how.4"></li></ol>
</details>

<main>
  <div class="stack">
    <section class="card">
      <h2 data-i18n="tpl.h"></h2>
      <p class="sub" data-i18n="tpl.sub"></p>
      <div class="templates" id="templates"></div>
    </section>
    <section class="card">
      <h2 data-i18n="tun.h"></h2>
      <p class="sub" data-i18n="tun.sub"></p>
      <div id="fields"></div>
    </section>
  </div>

  <div class="stack">
    <section class="card">
      <div class="row" style="justify-content:space-between">
        <div><h2 data-i18n="feel.h"></h2><p class="sub" style="margin:0" data-i18n="feel.sub"></p></div>
        <div class="row">
          <label for="diff" class="empty" data-i18n="feel.diff"></label>
          <select id="diff"></select>
          <label for="lvl" class="empty" data-i18n="feel.lvl"></label>
          <select id="lvl"></select>
        </div>
      </div>
      <div class="readouts" id="readouts" aria-live="polite" style="margin-top:12px"></div>
    </section>

    <section class="card">
      <h2 data-i18n="content.h"></h2>
      <div class="row" style="justify-content:space-between;align-items:flex-start">
        <p class="sub" style="max-width:640px" data-i18n="content.sub"></p>
        <div class="templates" id="goal" style="grid-template-columns:1fr 1fr;min-width:340px"></div>
      </div>
      <div class="overall"><span class="big" id="overallPct">0%</span><span class="empty" id="overallTxt"></span></div>
      <div class="piewrap">
        <div><h3 class="ph" data-i18n="pie.h"></h3>
          <div class="row" style="align-items:center;gap:20px"><svg id="pie" viewBox="0 0 260 260" width="260" height="260" role="img"></svg><ul class="pielegend" id="pieLegend"></ul></div>
          <p class="note" data-i18n="pie.note"></p></div>
        <div class="layers" id="layers"></div>
      </div>
      <div class="bars" id="bars"></div>
      <p class="note" id="seedsTxt"></p>
      <h2 style="margin-top:14px" data-i18n="missing.h"></h2>
      <ul class="changes" id="gaps"></ul>
    </section>
    <div class="grid2">
      <section class="card">
        <h2 data-i18n="hp.h"></h2>
        <p class="sub" data-i18n="hp.sub"></p>
        <svg id="hpChart" viewBox="0 0 520 260" width="100%" role="img"></svg>
        <div class="legend">
          <span><i style="background:var(--player)"></i><span data-i18n="hp.lg.player"></span></span>
          <span><i style="background:#a8ecd9"></i><span data-i18n="hp.lg.typ"></span></span>
          <span><i style="background:var(--avg)"></i><span data-i18n="hp.lg.avg"></span></span>
          <span><i style="background:var(--strong)"></i><span data-i18n="hp.lg.elite"></span></span>
          <span><i style="background:var(--boss)"></i><span data-i18n="hp.lg.boss"></span></span>
          <span><i class="dash"></i><span data-i18n="lg.before"></span></span>
        </div>
        <p class="note" id="hpNote"></p>
      </section>
      <section class="card">
        <h2 data-i18n="xp.h"></h2>
        <p class="sub" data-i18n="xp.sub"></p>
        <svg id="xpChart" viewBox="0 0 520 260" width="100%" role="img"></svg>
        <div class="legend">
          <span><i style="background:var(--accent)"></i><span data-i18n="xp.lg.now"></span></span>
          <span><i class="dash"></i><span data-i18n="lg.before"></span></span>
        </div>
      </section>
    </div>

    <div class="grid2">
      <section class="card">
        <h2 data-i18n="roll.h"></h2>
        <p class="sub" data-i18n="roll.sub"></p>
        <svg id="rollChart" viewBox="0 0 520 220" width="100%" role="img"></svg>
        <div class="legend" id="rollLegend"></div><p class="note" id="rollNote"></p>
      </section>
      <section class="card">
        <h2 data-i18n="chg.h"></h2>
        <p class="sub" data-i18n="chg.sub"></p>
        <ul class="changes" id="changes" aria-live="polite"></ul>
      </section>
    </div>

  </div>
</main>

<script src="i18n.js"></script>
<script>
// ---------- Voyage defaults (blank V37 export) ----------
const DEFAULT_WORLD = {
  heroesVersion: 37,
  attributeSettings:{attributeNames:["strength","dexterity","constitution","intelligence","wisdom","charisma"],startingAttributeValue:8,maxStartingAttribute:16,attributeBonusModifier:2.5},
  resourceSettings:{health:{name:"health",initialValue:80,maxValue:80,rechargeRate:1,gainPerLevel:10,isHealth:true}},
  otherSettings:{npcHealthPerLevel:12,npcMinHealth:66},
  progressionSettings:{startingCharacterLevelUpRequirement:1000,extraRequiredXPPerCharacterLevel:400,maxCharacterLevel:100,attributePointEveryLevels:5,attributePointsPerGrant:1},
  worldLore:{},regions:{},locations:{},factions:{},npcs:{},npcTypes:{},storyStarts:{},quests:{},narrativeEvents:{},skills:{},abilities:{},traits:{},itemTypes:{},triggers:{}
};

// NPC tier multipliers (engine): trivial .15 weak .5 average 1 strong 1.25 elite 1.5 boss 1.7 mythic 1.85
const TIERS = [{k:"avg",name:"Average",m:1,color:"var(--avg)"},{k:"strong",name:"Elite",m:1.5,color:"var(--strong)"},{k:"boss",name:"Boss",m:1.7,color:"var(--boss)"}];

function healthKey(w){
  const rs = w.resourceSettings||{};
  return Object.keys(rs).find(k=>rs[k]&&rs[k].isHealth) || Object.keys(rs).find(k=>k.toLowerCase()==="health") || "health";
}
const H = w => { w.resourceSettings = w.resourceSettings||{}; const k=healthKey(w); w.resourceSettings[k]=w.resourceSettings[k]||{name:k,isHealth:true}; return w.resourceSettings[k]; };
const sect = (w,s) => (w[s] = w[s]||{});
const rd = (w,s,k) => (w[s]||{})[k];
const hrd = (w,k) => ((w.resourceSettings||{})[healthKey(w)]||{})[k];
const esc = v => String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// ---------- Tunable fields ----------
const FIELDS = [
  {id:"startAttr", path:"attributeSettings.startingAttributeValue", min:4,max:16,step:1,
   get:w=>rd(w,"attributeSettings","startingAttributeValue"), set:(w,v)=>sect(w,"attributeSettings").startingAttributeValue=v},
  {id:"attrMod", path:"attributeSettings.attributeBonusModifier", min:0,max:5,step:0.5,
   get:w=>rd(w,"attributeSettings","attributeBonusModifier"), set:(w,v)=>sect(w,"attributeSettings").attributeBonusModifier=v},
  {id:"hp0", path:"resourceSettings.&lt;health&gt;.initialValue + maxValue", min:20,max:300,step:5,
   get:w=>hrd(w,"maxValue"), set:(w,v)=>{H(w).maxValue=v;H(w).initialValue=v;}},
  {id:"hpGain", path:"resourceSettings.&lt;health&gt;.gainPerLevel", min:0,max:40,step:1,
   get:w=>hrd(w,"gainPerLevel"), set:(w,v)=>H(w).gainPerLevel=v},
  {id:"npcHpLvl", path:"otherSettings.npcHealthPerLevel", min:0,max:40,step:1,
   get:w=>rd(w,"otherSettings","npcHealthPerLevel"), set:(w,v)=>sect(w,"otherSettings").npcHealthPerLevel=v},
  {id:"npcMin", path:"otherSettings.npcMinHealth", min:10,max:200,step:2,
   get:w=>rd(w,"otherSettings","npcMinHealth"), set:(w,v)=>sect(w,"otherSettings").npcMinHealth=v},
  {id:"xp0", path:"progressionSettings.startingCharacterLevelUpRequirement", min:100,max:3000,step:50,
   get:w=>rd(w,"progressionSettings","startingCharacterLevelUpRequirement"), set:(w,v)=>sect(w,"progressionSettings").startingCharacterLevelUpRequirement=v},
  {id:"xpStep", path:"progressionSettings.extraRequiredXPPerCharacterLevel", min:0,max:1500,step:50,
   get:w=>rd(w,"progressionSettings","extraRequiredXPPerCharacterLevel"), set:(w,v)=>sect(w,"progressionSettings").extraRequiredXPPerCharacterLevel=v},
  {id:"attrEvery", path:"progressionSettings.attributePointEveryLevels", min:1,max:10,step:1,
   get:w=>rd(w,"progressionSettings","attributePointEveryLevels"), set:(w,v)=>sect(w,"progressionSettings").attributePointEveryLevels=v},
];

// ---------- Templates ----------
const TEMPLATES = [
  {set:{startAttr:8,attrMod:2.5,hp0:80,hpGain:10,npcHpLvl:12,npcMin:66,xp0:1000,xpStep:400,attrEvery:5}},
  {set:{startAttr:12,hp0:110,hpGain:14,npcHpLvl:10,npcMin:56}},
  {set:{hpGain:8,npcHpLvl:14}},
  {set:{startAttr:8,hp0:55,hpGain:6,npcHpLvl:14,npcMin:80}},
  {set:{startAttr:12,attrMod:3,hp0:140,hpGain:18,npcHpLvl:10,xp0:600,xpStep:250,attrEvery:3}},
  {set:{xp0:1500,xpStep:650,attrEvery:5,hpGain:9}},
];

// ---------- Content readiness ----------
// count: how much there is (stage label only). ready: share of records that are filled in AND wired so play can reach them.
const filled = v => Array.isArray(v) ? v.length>0 : typeof v==="string" ? v.trim().length>0 : v!=null;
// Studio exports since 2026-11 keep quests / questTriggers / arcs / narrativeEvents under parties[""] and call triggers triggerDefinitions.
// Voyage blank-world seed keys (docs/blank-world-v37.json), so a world's own seeds can be told apart.
const DEFAULT_SEEDS={"authorSeeds": ["Ada Palmer", "Adrian Tchaikovsky", "Becky Chambers", "Brandon Sanderson", "China Miéville", "George R.R. Martin", "Guy Gavriel Kay", "Joe Abercrombie", "Katherine Addison", "Leigh Bardugo", "Lois McMaster Bujold", "Mark Lawrence", "N.K. Jemisin", "Richard K. Morgan", "Robin Hobb", "Scott Lynch", "Steven Erikson", "Terry Pratchett", "Ursula K. Le Guin"], "characterArchetypes": ["Artist", "Avenger", "Beast", "Believer", "Boss", "Comfort-Seeker", "Coward", "Crooked Leader", "Expert", "Fanatic", "Healer", "Innocent", "Joker", "Networker", "Protector", "Slacker", "Survivor", "Thrill-Seeker", "Troublemaker", "Wanderer", "Watcher", "Worker"], "regionArchetypes": ["Borderlands", "Contested Borders", "Disputed", "Divided Realm", "Exploited Land", "Fading Glory", "Forbidden Territory", "Forgotten Realm", "Frontier", "Healing Scars", "Heartland", "Hidden Network", "Meeting", "Rising Center", "Sacred Territory", "Sanctuary", "Seasonal Grounds", "Seat of Power", "Secluded Haven", "Shaped Domain", "Threshold", "Veiled Wonder", "Wanderer Paths"], "locationArchetypes": ["Crossroads", "Exchange Hub", "Gathering Thread", "Knowledge Cache", "Living History", "Power Struggle", "Quiet Craft", "Sanctuary", "Time Anchor", "True Believers", "Web of Corruption"], "encounterElements": ["Aid & Rescue", "Combat & Danger", "Commercial", "Criminal & Hidden", "Displaced", "Historical & Ancient", "Hostile", "Inhabited Places", "Merchants & Traders", "Military & Defense", "Military & Law", "Mystery & Investigation", "Natural & Environmental", "Natural Features", "Outlaws", "Recent Activity", "Religious & Mystical", "Religious & Mystical Characters", "Social & Diplomatic", "Specialists", "Travelers"]};
const PARTY_SECTIONS=["quests","questTriggers","arcs","narrativeEvents","entities"];
function sec(w,k){
  if(!w) return {};
  if(k==="triggers") return w.triggers||w.triggerDefinitions||{};
  if(w[k]) return w[k];
  if(PARTY_SECTIONS.includes(k)&&w.parties&&typeof w.parties==="object"){
    const out={}; Object.values(w.parties).forEach(pt=>{if(pt&&pt[k]) Object.assign(out,pt[k]);}); return out;
  }
  return {};
}
const has = (...ks) => r => ks.every(k=>filled(r[k]));
function refs(w){
  const quests=new Set(), events=new Set(); let scripts="";
  Object.values(sec(w,"storyStarts")).forEach(st=>(st.startingQuests||[]).forEach(q=>quests.add(q)));
  (function walk(o){
    if(Array.isArray(o)){o.forEach(walk);return;}
    if(!o||typeof o!=="object")return;
    if(["quest-init","quest-accept","quest-plan"].includes(o.type)&&o.value) quests.add(o.value);
    if(o.type==="narrative-event-start"&&o.eventId) events.add(o.eventId);
    if(typeof o.script==="string") scripts+="\n"+o.script;
    Object.values(o).forEach(walk);
  })([sec(w,"triggers"),sec(w,"questTriggers"),sec(w,"quests"),sec(w,"narrativeEvents"),sec(w,"storyStarts")]);
  const hit=(set,k,r)=>set.has(k)||(r&&r.name&&set.has(r.name))||(r&&r.title&&set.has(r.title))||scripts.includes(k);
  return {quest:(k,r)=>hit(quests,k,r), event:(k,r)=>hit(events,k,r)};
}
const CONTENT = [
  {name:"Lore", keys:["worldLore"], stages:[5,279], checks:[["text",r=>filled(r.text)]]},
  {name:"Places", keys:["realms","regions","locations"], stages:[6,737], checks:[["basic description",r=>filled(r.basicInfo)]]},
  {name:"Factions", keys:["factions"], stages:[2,36], checks:[["basic description",r=>filled(r.basicInfo)]]},
  {name:"NPCs", keys:["npcs"], stages:[6,595], checks:[["basic description",r=>filled(r.basicInfo)],["personality",r=>filled(r.personality)],["location",r=>filled(r.currentLocation)],["looks (portrait or visual description)",r=>filled(r.visualDescription)||filled(r.portraitUrl)]]},
  {name:"NPC types", keys:["npcTypes"], stages:[2,92], checks:[["description",r=>filled(r.description)]]},
  {name:"Story starts", keys:["storyStarts"], stages:[1,65], skip:r=>/write your own/i.test(r.name||""), checks:[["opening text",r=>filled(r.storyStart)],["location",r=>filled(r.locations)]]},
  {name:"Quests & arcs", keys:["quests","arcs"], stages:[3,582], checks:[["a way to reach the player (a start's quests or a trigger)",(r,k,R)=>R.quest(k,r),["quests"]],["quest statement or objective",r=>filled(r.questStatement||r.mainObjective),["quests"]],["arc premise",r=>filled(r.surfacePremise||r.theme),["arcs"]]]},
  {name:"Narrative events", keys:["narrativeEvents"], stages:[1,49], checks:[["something that starts it",(r,k,R)=>R.event(k,r)],["beats",r=>filled(r.beats)]]},
  {name:"Skills / abilities / traits", keys:["skills","abilities","traits"], stages:[10,1652], checks:[["description",r=>filled(r.description)]]},
  {name:"Creator", keys:["traitCategories","premadeCharacters"], stages:[2,0], checks:[["description",r=>filled(r.description)],["traits",r=>filled(r.traits)]]},
  {name:"Modes & voices", keys:["gameModes","worldVoices"], stages:[1,0], checks:[["instructions or description",r=>filled(r.instructions)||filled(r.description),["gameModes"]],["voice tag",r=>filled(r.voiceTag),["worldVoices"]]]},
  {name:"Items", keys:["itemTypes"], stages:[8,553], checks:[["description",r=>filled(r.description)]]},
];
// Full-world bar: Voyage's published publish-stage limits (docs/unofficial-limits-v37.json). size = compact JSON with empty values dropped (Voyage's own measure).
const CAPS={
  "Lore":[{k:"worldLore",m:"size",cap:1000000}],
  "Places":[{k:"realms",m:"size",cap:100000,optional:true},{k:"regions",m:"size",cap:500000},{k:"locations",m:"size",cap:2000000}],
  "Factions":[{k:"factions",m:"size",cap:100000}],
  "NPCs":[{k:"npcs",m:"size",cap:2000000}],
  "NPC types":[{k:"npcTypes",m:"size",cap:500000}],
  "Story starts":[{k:"storyStarts",m:"count",cap:101}],

const vsize=r=>JSON.stringify(r,(k,v)=>v===""||v===null||(Array.isArray(v)&&!v.length)?undefined:v).length;
function capShare(w,c,readySet){
  const parts=CAPS[c.name].map(p=>{
    const recs=Object.entries(sec(w,p.k)).filter(([,r])=>readySet.has(r));
    const used=p.m==="count"?recs.length:recs.reduce((t,[,r])=>t+vsize(r),0);
    const cap=p.share?Math.max(1,Math.round(WORLD_TEXT/CONTENT.length)):p.cap;   // no section limit: an average area's share of this world's text
    return {used,cap,m:p.m,share:p.share,k:p.k,optional:p.optional,any:Object.keys(sec(w,p.k)).length};
  }).filter(x=>!(x.optional&&!x.any));   // a section the world does not use (realms, arcs, voices) is not held against it
  if(!parts.length) return {f:0,parts};
  const shared=parts.filter(x=>x.share), own=parts.filter(x=>!x.share);
  const scored=shared.length?[...own,{used:shared.reduce((t,x)=>t+x.used,0),cap:shared[0].cap}]:own;   // no-limit sections of one area pool their text

// attributeSettings doc: attributeStatModifiers maps an attribute to [{variable, amount}] ("every point of the attribute adds amount");
// the 2026-11-10 patch made it a list, older worlds hold one object. A new character's attributes sit at startingAttributeValue.
function attrHealth(w){
  const as=w.attributeSettings||{}, hk=healthKey(w), start=val(w,"startAttr");
  return Object.values(as.attributeStatModifiers||{}).reduce((t,m)=>t+(Array.isArray(m)?m:[m]).filter(x=>x&&x.variable===hk).reduce((u,x)=>u+num(x.amount,0)*start,0),0);

const playerHP = (w,L) => val(w,"hp0") + val(w,"hpGain")*(L-1) + attrHealth(w);
// Creator picks: each category page lets a player take maxSelections of its traits. "typical" = the average trait of each

function creatorBuild(w){
  const traits=w.traits||{}, cats=Object.values(w.traitCategories||{}), hk=healthKey(w);
  const byName={}; Object.entries(traits).forEach(([k,t])=>{byName[k]=t; if(t&&t.name) byName[t.name]=t;});
  const names=(w.attributeSettings&&w.attributeSettings.attributeNames)||DEFAULT_WORLD.attributeSettings.attributeNames;

  cats.forEach(c=>{
    const ts=(c.traits||[]).map(k=>byName[k]).filter(Boolean); if(!ts.length) return;
    const k=Math.max(1,Math.min(num(c.maxSelections,1),ts.length)); picks+=k;
    const mod=(t,a)=>(t.attributes||[]).filter(x=>x&&x.attribute===a).reduce((u,x)=>u+num(x.modifier,0),0);
    names.forEach(a=>{const v=ts.map(t=>mod(t,a)); typ[a]+=v.reduce((u,x)=>u+x,0)/ts.length*k; best[a]+=v.sort((x,y)=>y-x).slice(0,k).reduce((u,x)=>u+x,0);});
    hpTyp+=ts.map(t=>(t.resources||[]).filter(x=>x&&(x.resource||x.variable)===hk).reduce((u,x)=>u+num(x.modifier,0),0)).reduce((u,x)=>u+x,0)/ts.length*k;
  });
  return {typ,best,hpTyp,picks,cats:cats.length};
}

function attrsOf(w,kind){

}
function attrHealthAt(w,attrs){
  const as=w.attributeSettings||{}, hk=healthKey(w);
  return Object.entries(as.attributeStatModifiers||{}).reduce((t,[a,m])=>t+(Array.isArray(m)?m:[m]).filter(x=>x&&x.variable===hk).reduce((u,x)=>u+num(x.amount,0)*num(attrs[a],val(w,"startAttr")),0),0);

const playerHPTyp = (w,L) => val(w,"hp0") + val(w,"hpGain")*(L-1) + attrHealthAt(w,attrsOf(w,"typ")) + buildOf(w).hpTyp;
const npcHP = (w,L,tier,diff) => (val(w,"npcHpLvl")*L + val(w,"npcMin")) * tier * diff;

const PAD={l:48,r:12,t:12,b:28};
function axes(svg,W,Hh,xMax,yMax,xLabel){
  let s="";
  const ticks=5;
  for(let i=0;i<=ticks;i++){
    const y=PAD.t+(Hh-PAD.t-PAD.b)*(1-i/ticks), v=yMax*i/ticks;
    s+=`<line x1="${PAD.l}" x2="${W-PAD.r}" y1="${y}" y2="${y}" stroke="#2a2b30"/>`;
    s+=`<text x="${PAD.l-6}" y="${y+4}" text-anchor="end">${v>=10000?Math.round(v/1000)+"k":fmt(v)}</text>`;
  }
  [1,Math.round(xMax/4),Math.round(xMax/2),Math.round(xMax*3/4),xMax].forEach(L=>{
    const x=PAD.l+(W-PAD.l-PAD.r)*(L-1)/(xMax-1);
    s+=`<text x="${x}" y="${Hh-8}" text-anchor="middle">${L}</text>`;
  });
  s+=`<text x="${W-PAD.r}" y="${Hh-8}" text-anchor="end" style="display:none">${xLabel}</text>`;
  return s;
}
function linePath(pts,W,Hh,xMax,yMax){
  return pts.map((y,i)=>{
    const L=i+1, x=PAD.l+(W-PAD.l-PAD.r)*(L-1)/(xMax-1), yy=PAD.t+(Hh-PAD.t-PAD.b)*(1-y/yMax);
    return (i?"L":"M")+x.toFixed(1)+","+yy.toFixed(1);
  }).join("");
}

function niceMax(v){if(v<=0)return 10;const p=Math.pow(10,Math.floor(Math.log10(v)));return Math.ceil(v/p*2)/2*p;}

function areaRecords(w,c){return c.keys.flatMap(k=>Object.entries(sec(w,k)).map(([id,r])=>[id,r,k])).filter(([k,r])=>!(c.skip&&r&&c.skip(r)));}

function drawContent(){

    if(full&&full.f<1) gaps.push(t("gap.full",an,Math.floor(full.f*rd*100),full.parts.map(x=>t("gap.part",x.k,fmt(x.used),fmt(x.cap),x.m==="count",x.share)).join("; ")));

function drawPie(scores){
  // Slice = the area's slice of the whole world (score / 100 / areas); the grey slice is what is still to build.
  const cx=130, cy=130, r=118, n=scores.length;
  const parts=scores.map((x,i)=>({f:x.score/100/n, c:PIE[i%PIE.length]}));
  const left=1-parts.reduce((t,x)=>t+x.f,0);
  if(left>0.0005) parts.push({f:left, c:"var(--panel2)", grey:true});
  const pt=(rad,a)=>`${(cx+rad*Math.cos(a)).toFixed(1)},${(cy+rad*Math.sin(a)).toFixed(1)}`;
  let s="", ang=-Math.PI/2;
  parts.forEach(x=>{
    if(x.f<=0) return;
    const a2=ang+x.f*2*Math.PI, m=(ang+a2)/2;
    s+= x.f>=0.9995 ? `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${x.c}" stroke="#111" stroke-width="2"/>`
                    : `<path d="M${cx},${cy} L${pt(r,ang)} A${r},${r} 0 ${x.f>.5?1:0} 1 ${pt(r,a2)} Z" fill="${x.c}" stroke="#111" stroke-width="2"/>`;
    if(x.f>=.035){const [tx,ty]=pt(r*(x.grey?.5:.68),m).split(",");s+=`<text x="${tx}" y="${(+ty+5).toFixed(1)}" text-anchor="middle" style="fill:${x.grey?"var(--muted)":"#f2f2f4"};font-weight:600">${x.grey?esc(t("pie.left")):""}${Math.round(x.f*100)}%</text>`;}
    ang=a2;
  });
  $("pie").innerHTML=s;
  $("pie").setAttribute("aria-label",t("pie.aria")+scores.map(x=>`${areaName(x.name)} ${x.score}`).join(t("sep")));
  $("pieLegend").innerHTML=scores.map((x,i)=>`<li><i style="background:${PIE[i%PIE.length]}"></i>${esc(areaName(x.name))} <b>[${x.score}]</b></li>`).join("")+`<li><i style="background:var(--panel2);border:1px solid var(--line)"></i>${esc(t("pie.leftLg"))}</li>`;
  const avg=names=>{const v=scores.filter(x=>names(x.name));return v.length?Math.round(v.reduce((t,x)=>t+x.score,0)/v.length):0;};
  const set=avg(n=>SETTING.includes(n)), play=avg(n=>!SETTING.includes(n));
  $("layers").innerHTML=`
    <div class="layer" style="background:#2f5e58"><b>${esc(t("layer.set"))}</b><span>${esc(t("layer.setSub"))}</span><big>${set}%</big></div>
    <div class="layer" style="background:#6a3446"><b>${esc(t("layer.play"))}</b><span>${esc(t("layer.playSub"))}</span><big>${play}%</big></div>
    <div class="layer overall-hex"><b>${esc(t("layer.overall"))}</b><big>${$("overallPct").textContent}</big><span>${esc(t(`goal.${goal}.as`))}</span></div>`;
}

// ---------- Render ----------
function render(){
  FIELDS.forEach(f=>{
    const v=cur(f.id), b=was(f.id);
    const el=$("f_"+f.id);
    el.min=Math.min(f.min,v); el.max=Math.max(f.max,v);
    el.step=Number.isInteger(Math.round((v-f.min)/f.step*1e6)/1e6)?f.step:"any";
    if(Number(el.value)!==v) el.value=v;
    $("o_"+f.id).textContent=nv(v);
    const raw=f.get(base), def=f.get(clone(DEFAULT_WORLD));
    const src=raw==null?t("src.unset"):Number(raw)===def?t("src.same"):t("src.world");
    const be=$("b_"+f.id); be.textContent=t("base.loaded",nv(b),v===b?"":pct(b,v))+` · ${fileName?src:t("src.default")}`; be.classList.toggle("changed",v!==b);
  });
  [...$("templates").children].forEach((b,i)=>{b.classList.toggle("active",activeTpl===i);b.setAttribute("aria-pressed",String(activeTpl===i));});
  drawReadouts(); drawHP(); drawXP(); drawRoll(); drawChanges(); drawContent();
}

// ---------- Load / export ----------
function unwrap(o){
  const isWorld=x=>x&&typeof x==="object"&&!Array.isArray(x)&&("heroesVersion" in x||"npcs" in x||"storyStarts" in x||"triggerDefinitions" in x);
  // Studio exports are the world itself; Creator API downloads wrap it ({world: {initialGameState: ...}}).
  let level=[o];
  for(let d=0;d<4&&level.length;d++){
    const hit=level.find(isWorld); if(hit) return hit;
    level=level.flatMap(x=>x&&typeof x==="object"&&!Array.isArray(x)?Object.values(x).filter(v=>v&&typeof v==="object"&&!Array.isArray(v)):[]);
  }
  throw new Error(t("err.noWorld"));
}
const DIFF={"very easy":0.5,"easy":0.75,"medium":1,"hard":1.25,"very hard":1.5};
let MODES=[];   // the loaded world's game modes that name a Voyage difficulty
function buildDiff(keep){
  const el=$("diff"), i=keep?el.selectedIndex:-1;
  el.innerHTML=Object.entries(DIFF).map(([n,v])=>`<option value="${v}"${v===1?" selected":""}>${esc(t("diff."+n))}</option>`).join("")
    +(MODES.length?`<optgroup label="${esc(t("diff.modes"))}">`+MODES.map(([k,m])=>`<option value="${DIFF[m.difficulty]}">${esc(m.name||k)} (${esc(t("diff."+m.difficulty).toLocaleLowerCase(LOCALES[LANG]))})</option>`).join("")+`</optgroup>`:"");
  if(i>=0&&i<el.options.length) el.selectedIndex=i;
}
function drawSrc(){ $("src").textContent=fileName?`${fileName}${base.heroesVersion?` (V${base.heroesVersion})`:""}`:t("src.none"); }
function loadWorld(obj,name){
  obj=unwrap(obj);
  base=clone(obj); work=clone(obj); fileName=name; activeTpl=null; WORLD_TEXT=Math.max(1,vsize(obj));
  MODES=Object.entries(obj.gameModes||{}).filter(([,m])=>m&&Object.hasOwn(DIFF,m.difficulty));
  buildDiff(false); drawSrc();
  render();
}
const readFile=f=>f.text().then(txt=>loadWorld(JSON.parse(txt.replace(/^\uFEFF/,"")),f.name)).catch(err=>alert(t("err.read")+err.message));
$("file").addEventListener("change",e=>{ const f=e.target.files[0]; if(f) readFile(f); });
document.addEventListener("dragover",e=>e.preventDefault());
document.addEventListener("drop",e=>{ e.preventDefault(); const f=e.dataTransfer.files[0]; if(f) readFile(f); });
$("reset").onclick=()=>{work=clone(base);activeTpl=null;render();};
$("export").onclick=()=>{
  const blob=new Blob([JSON.stringify(work,null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download=(fileName||"world.json").replace(/\.json$/,"")+".tuned.json"; a.click(); URL.revokeObjectURL(a.href);
};
$("diff").onchange=render; $("lvl").onchange=render;

function buildGoals(){
  $("goal").innerHTML="";
  GOALS.forEach(i=>{const b=document.createElement("button");b.className="tpl";b.innerHTML=`<b>${esc(t(`goal.${i}.name`))}</b><span>${esc(t(`goal.${i}.desc`))}</span>`;b.onclick=()=>{goal=i;drawContent();};$("goal").appendChild(b);});
}
function applyLang(){
  document.documentElement.lang=LOCALES[LANG]; document.documentElement.dir=RTL.has(LANG)?"rtl":"ltr"; document.title=t("doc.title");
  document.querySelectorAll("[data-i18n]").forEach(el=>{el.innerHTML=t(el.dataset.i18n);});   // page text only, never world data
  document.querySelectorAll("[data-i18n-title]").forEach(el=>{el.title=t(el.dataset.i18nTitle);});
  $("lang").value=LANG;
  buildFields(); buildTemplates(); buildGoals(); buildDiff(true); drawSrc();
}
$("lang").innerHTML=Object.entries(LANGS).map(([k,n])=>`<option value="${k}">${n}</option>`).join("");
$("lang").onchange=e=>{ LANG=e.target.value; try{localStorage.setItem("tuner.lang",LANG);}catch(err){} applyLang(); render(); };

try{ if(localStorage.getItem("tuner.how")==="closed") $("how").open=false; }catch(e){}
$("how").addEventListener("toggle",()=>{ try{localStorage.setItem("tuner.how",$("how").open?"open":"closed");}catch(e){} });
buildLevels(); applyLang();
render();
window.__tuner={sec,loadWorld,readyCounts,CONTENT,refs,areaRecords,missingBy,FIELDS,cur,was,TEMPLATES,work:()=>work};
</script>
</body>
